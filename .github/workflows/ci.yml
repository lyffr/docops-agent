name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements-dev.lock
      - run: pip install --no-deps --editable .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m compileall -q docops_agent scripts tests
      - run: pip check
      - run: docker compose config --quiet
      - run: docker build --tag docops-agent:test .

