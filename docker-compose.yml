services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DOCOPS_DATABASE_PATH: /state/docops.db
    volumes:
      - docops-state:/state

  ui:
    build: .
    command: streamlit run docops_agent/streamlit_app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DOCOPS_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  docops-state:
